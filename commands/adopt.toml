description = "Adota um projeto existente no jeito Garlic: traz a pasta docs (cerebro), gera o .code-workspace com as pastas que ja existem e explica como adicionar mais"
prompt = "Adotar o produto existente `{{args}}` no jeito Garlic. Fonte da verdade: skills/adopt/SKILL.md. Se `{{args}}` estiver vazio, perguntar o nome (minusculo, sem espaco). Passos: (1) mapear repos existentes em $BASE (subpastas com .git), perguntar uma vez quais entram e o papel de cada; NAO renomear nem alterar os repos existentes. (2) clonar gitlab.com/planodeominacao/garlic.docs para $BASE/<produto>-docs, cortar historico (1 commit), trocar 'garlic' por <produto> no docs, perguntar antes de apagar PRD/CHANGELOG/RELEASES do template; se <produto>-docs ja existir, nao sobrescrever. (3) gerar <produto>-docs/<produto>.code-workspace com docs em '.' e os demais com paths relativos reais; verificar que todos resolvem. (4) o hook garlic-detect.js reconhece o workspace pela pasta *-docs irma com .code-workspace. (5) reportar: File > Open Workspace from File…, como adicionar pastas (Add Folder to Workspace + Save Workspace As, ou editar o JSON), reiniciar a sessao, pendencias (documentar o produto no docs, /garlic:ci, /garlic:rebrand)."
