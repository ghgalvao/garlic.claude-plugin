description = "Cria, ajusta ou diagnostica o CI/CD (GitLab -> FTP em hospedagem Windows/IIS) de um front estatico e/ou API .NET"
prompt = "Configurar ou diagnosticar o CI/CD do produto `{{args}}` (GitLab -> FTP em hospedagem Windows/IIS). Fonte da verdade: skills/ci/SKILL.md e skills/ci/templates/ — copiar e adaptar os templates, nunca reescrever do zero. Antes de mexer: ler o .gitlab-ci.yml existente e os docs do produto; descobrir o escopo (front estatico, API .NET ou ambos).\n\nRegras que sempre valem: segredo nunca entra no repo (valores so nas variaveis do GitLab; o CI gera o appsettings.json no deploy); variaveis com Protect OFF e Expand variable reference OFF, Mask nas senhas; FTP_PATH e relativo a raiz do usuario FTP (conferir no FileZilla); lftp mirror SEM --delete (limpeza so com mrm de padrao explicito, depois do upload, com || true); na API, o IIS roda em Production, entao o CI grava o MESMO JSON em appsettings.json e appsettings.Production.json e remove o Development (um Production antigo no servidor sobrescreve a config nova); gerar JSON com jq --arg; app_offline.htm sobe antes e e removido no after_script; manter appsettings.Development.example.json versionado listando TODAS as variaveis.\n\nPush em main publica de verdade: mudanca visual em site de cliente so vai pro ar depois do usuario validar em localhost; commits so de CI/config/docs usam [skip ci]. Verificar no ar com wait-deploy.sh (janela de 503 + impressoes digitais), usando so chamadas invalidas — nunca POST real sem autorizacao do usuario. O GitLab web barra navegador automatizado (Cloudflare): nao contornar, pedir ao dev que cole as ultimas linhas do job.\n\nAo final, reportar: arquivos criados/alterados, variaveis que o usuario ainda precisa cadastrar (nome e flags, nunca o valor), resultado real das verificacoes (ou o que nao deu pra verificar) e pendencias do usuario."
