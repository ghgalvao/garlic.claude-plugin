description = "Audita a UI de um produto Garlic: lint mecanico (cor literal, paleta padrao, borda forte, html cru, i18n) + julgamento de 'visual de IA', estados e acessibilidade, corrigindo com tokens do design system"
prompt = "Auditar a UI de `{{args}}` (tela/feature; vazio = diff da branch atual). Fonte da verdade: skills/design/SKILL.md. Ler project/DESIGN.md do frontend antes de julgar; se nao definir identidade, avisar. Rodar skills/design/scripts/design-lint.mjs (default apps/*/src), corrigir achados reais com token ou componente do @banana/ui (criar la primeiro se nao existir; falso positivo legitimo recebe design-lint-ignore com motivo). Julgar o que regex nao pega: cara de IA (hero generico, 3 cards iguais, cartao dentro de cartao, sopa de chips, CTA vago), hierarquia/tipografia, estados (loading/erro/vazio/sucesso/foco), responsivo ~400px, contraste AA nos dois temas, teclado, regras da casa (elevation em vez de borda, zero string hardcoded). Mudanca de direcao visual e do usuario: propor, nao aplicar. Reportar: lint antes/depois, correcoes (arquivo:linha), ate 5 itens de julgamento priorizados, pendencias."
