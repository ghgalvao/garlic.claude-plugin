description = "Bootstrapar um produto novo a partir do template Garlic (clona 5 repos, corta histórico git, renomeia todo vestígio de 'garlic', corrige .code-workspace)"
prompt = "Bootstrapar um produto novo chamado `{{args}}` a partir do template Garlic (grupo GitLab gitlab.com/planodeominacao, repos privados: garlic.frontend, garlic.infra, garlic.automations, garlic.backend, garlic.docs). Se `{{args}}` estiver vazio, perguntar o nome do produto (minúsculo, sem espaço) antes de continuar.\n\nExecutar de verdade via Bash (não só descrever), na ordem:\n\n1. Clonar os 5 repos no diretório atual, renomeando já no clone (SEMPRE com hífen, ex. <produto>-frontend, nunca ponto — o GitLab real dos produtos usa hífen mesmo o template usando ponto), e capturar o diretório base logo depois: mkdir -p <produto> && cd <produto> && git clone https://gitlab.com/planodeominacao/garlic.frontend.git <produto>-frontend && git clone https://gitlab.com/planodeominacao/garlic.infra.git <produto>-infra && git clone https://gitlab.com/planodeominacao/garlic.automations.git <produto>-automations && git clone https://gitlab.com/planodeominacao/garlic.backend.git <produto>-backend && git clone https://gitlab.com/planodeominacao/garlic.docs.git <produto>-docs && BASE=\"$(pwd)\". Cwd fica pendurado em $BASE entre chamadas de tool — nunca assumir que voltou pra raiz sozinho. Todo passo seguinte abre com cd \"$BASE/<produto>-<parte>\" absoluto.\n\n2. Cortar a história de cada uma das 5 pastas, a partir de $BASE: cd \"$BASE/<produto>-<parte>\" && rm -rf .git && git init -q && git add -A && git commit -q -m \"Initial commit: <produto>-<parte> (a partir do template Garlic)\" && git log --oneline. Repetir pras 5 pastas. Perguntar nome/e-mail git do dev ANTES, configurar --local em cada repo. Verificar: git log --oneline deve mostrar EXATAMENTE 1 commit.\n\n3. Perguntar se o dev já quer criar os remotes novos (GitLab/GitHub) e dar push (branch master + branch develop). Só fazer se confirmado. Confirmar que o slug remoto usa hífen também, senão usar o mesmo separador em tudo daqui pra frente.\n\n4. Corrigir o .code-workspace: dentro de <produto>-docs, renomear garlic.code-workspace para <produto>.code-workspace, trocar os 4 paths (../garlic.<parte> para ../<produto>-<parte>) e o typescript.tsdk.\n\n5. Renomear TODO vestígio interno de 'garlic' — isto é nome, não marca, roda sempre aqui, não espera decisão de cor/fonte. Renomear pasta apps/garlic para apps/<produto> e apps/<produto>/src/app/styles/garlic-theme.css para theme.css (ajustar o @import em index.css). Em <produto>-backend, renomear Garlic.Backend.csproj/.sln/.http para <Produto>.Backend.* (PascalCase) e trocar a string Garlic.Backend dentro do .sln/.http. Depois, em CADA um dos 5 repos, rodar grep -rni \"garlic\" --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=bin --exclude-dir=obj . (SEMPRE case-insensitive, -i — um grep case-sensitive antigo deixava passar quase tudo, que é minúsculo) e trocar TODA ocorrência: prefixo de variável CSS --color-garlic-* para --color-<produto>-* (e as classes Tailwind derivadas bg-garlic-*/text-garlic-*/border-garlic-* em todo .tsx/.ts), nome de animação garlic-spin, chaves de localStorage (garlic-theme, garlic:mock-overrides), rotas/nomes do Vite dev server (/__garlic/write-env, /__garlic/write-globals-css, garlic-env-writer, garlic-globals-css-writer), campo name dos package.json e scripts pnpm --filter garlic, strings em translations/*.json (inclusive garlic.docs/garlic.frontend/etc viram <produto>-docs/<produto>-frontend com hífen), <title>Garlic</title> no index.html, e o e-mail mock dev@garlic.local para dev@<produto>.local em fixtures.ts/mockClient.ts. Verificar no final: o mesmo grep -rni \"garlic\" em cada um dos 5 repos TEM que voltar vazio (fora lockfiles) — isso é o critério de sucesso, não \"rodei os passos\". Depois rodar pnpm install && pnpm build em <produto>-frontend e dotnet build em <produto>-backend, os dois têm que passar verde antes de seguir.\n\n6. Instruir o dev, de forma explícita no report final, a abrir o workspace no editor — File > Open Workspace from File… > <produto>-docs/<produto>.code-workspace. Nunca abrir só uma das 5 pastas soltas.\n\n7. Parar aqui — NÃO escolher cor/fonte automaticamente, isso é decisão de marca separada do dev (o nome já foi resolvido no passo 5, não depende disso). Quando ele quiser aplicar cor/fonte: comando/skill garlic:rebrand (mesmo plugin).\n\nSe algum dos 5 repos clonados tiver localmente .agent/workflows/bootstrap-new-product.md (normalmente em <produto>-docs), usar como referência/conferência do processo acima, não repetir do zero se já bater com o que está descrito aqui.\n\nAo final, reportar exatamente o que foi feito (passos 1-6), destacar o comando pra abrir o workspace (File > Open Workspace from File… > <produto>-docs/<produto>.code-workspace), e o que ficou pendente (cor/fonte via garlic:rebrand, Notion via bootstrap-notion.md, push se não confirmado no passo 3)."
