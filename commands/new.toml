description = "Bootstrapar um produto novo a partir do template Garlic (clona 5 repos, corta histórico git, cria develop, corrige .code-workspace)"
prompt = "Bootstrapar um produto novo chamado `{{args}}` a partir do template Garlic (grupo GitLab gitlab.com/planodeominacao, repos privados: garlic.frontend, garlic.infra, garlic.automations, garlic.backend, garlic.docs). Se `{{args}}` estiver vazio, perguntar o nome do produto (minúsculo, sem espaço) antes de continuar.\n\nExecutar de verdade via Bash (não só descrever), na ordem:\n\n1. Clonar os 5 repos no diretório atual, renomeando já no clone, e capturar o diretório base logo depois: mkdir -p <produto> && cd <produto> && git clone https://gitlab.com/planodeominacao/garlic.frontend.git <produto>.frontend && git clone https://gitlab.com/planodeominacao/garlic.infra.git <produto>.infra && git clone https://gitlab.com/planodeominacao/garlic.automations.git <produto>.automations && git clone https://gitlab.com/planodeominacao/garlic.backend.git <produto>.backend && git clone https://gitlab.com/planodeominacao/garlic.docs.git <produto>.docs && BASE=\"$(pwd)\". Cwd fica pendurado em $BASE entre chamadas de tool (Bash persiste diretório entre execuções) — nunca assumir que voltou pra raiz sozinho. Todo passo seguinte abre com cd \"$BASE/<produto>.<parte>\" absoluto, nunca cd <produto>.<parte> relativo.\n\n2. Cortar a história de cada uma das 5 pastas, a partir de $BASE: cd \"$BASE/<produto>.<parte>\" && rm -rf .git && git init -q && git add -A && git commit -q -m \"Initial commit: <produto>.<parte> (a partir do template Garlic)\" && git log --oneline. Repetir pras 5 pastas, sempre abrindo com cd \"$BASE/<produto>.<parte>\" absoluto primeiro. Perguntar nome/e-mail git do dev ANTES, configurar --local em cada repo — nunca mexer na config global do git. Verificar cada uma: git log --oneline deve mostrar EXATAMENTE 1 commit — mais que isso é cwd errado (causa mais provável), conferir pwd antes de tentar de novo.\n\n3. Perguntar se o dev já quer criar os remotes novos (GitLab/GitHub) e dar push (branch master + branch develop a partir dela). Só fazer se confirmado — não assumir, não criar remote sem o dev ter os 5 projetos vazios prontos do outro lado.\n\n4. Corrigir o .code-workspace: dentro de <produto>.docs, renomear garlic.code-workspace para <produto>.code-workspace, trocar os 4 paths (../garlic.<parte> para ../<produto>.<parte>) e o typescript.tsdk. Confirmar abrindo o arquivo (conteúdo) depois. Instruir o dev, de forma explícita no report final, a abrir esse arquivo no editor — File > Open Workspace from File… > <produto>.docs/<produto>.code-workspace. Nunca abrir só uma das 5 pastas soltas.\n\n5. Parar aqui — NÃO fazer o rebrand de conteúdo (cores/strings/copy) automaticamente, isso é decisão separada do dev. Quando ele quiser seguir: comando/skill garlic:rebrand (mesmo plugin) faz isso direito.\n\nSe algum dos 5 repos clonados tiver localmente .agent/workflows/bootstrap-new-product.md (normalmente em <produto>.docs), usar como referência/conferência do processo acima, não repetir do zero se já bater com o que está descrito aqui.\n\nAo final, reportar exatamente o que foi feito (passos 1-4), destacar o comando pra abrir o workspace (File > Open Workspace from File… > <produto>.docs/<produto>.code-workspace), e o que ficou pendente (rebrand de conteúdo, Notion via bootstrap-notion.md, push se não confirmado no passo 3)."
