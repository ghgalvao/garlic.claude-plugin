description = "Bootstrapar um produto novo a partir do template Garlic (clona 5 repos, corta histórico git, cria develop, corrige .code-workspace)"
prompt = "Bootstrapar um produto novo chamado `{{args}}` a partir do template Garlic (grupo GitLab gitlab.com/planodeominacao, repos privados: garlic.frontend, garlic.infra, garlic.automations, garlic.backend, garlic.docs). Se `{{args}}` estiver vazio, perguntar o nome do produto (minúsculo, sem espaço) antes de continuar.\n\nExecutar de verdade via Bash (não só descrever), na ordem:\n\n1. Clonar os 5 repos no diretório atual, renomeando já no clone: mkdir -p <produto> && cd <produto> && git clone https://gitlab.com/planodeominacao/garlic.frontend.git <produto>.frontend && git clone https://gitlab.com/planodeominacao/garlic.infra.git <produto>.infra && git clone https://gitlab.com/planodeominacao/garlic.automations.git <produto>.automations && git clone https://gitlab.com/planodeominacao/garlic.backend.git <produto>.backend && git clone https://gitlab.com/planodeominacao/garlic.docs.git <produto>.docs\n\n2. Cortar a história de cada uma das 5 pastas (rm -rf .git && git init -q && git add -A && git commit -q -m \"Initial commit: <produto>.<parte> (a partir do template Garlic)\"). Perguntar nome/e-mail git do dev ANTES, configurar --local em cada repo — nunca mexer na config global do git.\n\n3. Perguntar se o dev já quer criar os remotes novos (GitLab/GitHub) e dar push (branch master + branch develop a partir dela). Só fazer se confirmado — não assumir, não criar remote sem o dev ter os 5 projetos vazios prontos do outro lado.\n\n4. Corrigir o .code-workspace: dentro de <produto>.docs, renomear garlic.code-workspace para <produto>.code-workspace, trocar os 4 paths (../garlic.<parte> para ../<produto>.<parte>) e o typescript.tsdk. Confirmar abrindo o arquivo depois.\n\n5. Parar aqui — NÃO fazer o rebrand de conteúdo (cores/strings/copy) automaticamente, isso é decisão separada do dev (ver <produto>.docs/GETTING_STARTED.md §Rebrand quando ele quiser seguir).\n\nSe algum dos 5 repos clonados tiver localmente .agent/workflows/bootstrap-new-product.md (normalmente em <produto>.docs), usar como referência/conferência do processo acima, não repetir do zero se já bater com o que está descrito aqui.\n\nAo final, reportar exatamente o que foi feito (passos 1-4) e o que ficou pendente (rebrand de conteúdo, Notion via bootstrap-notion.md, push se não confirmado no passo 3)."
