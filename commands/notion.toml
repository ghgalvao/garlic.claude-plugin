description = "Monta o HQ do produto no Notion (Infra/Repos/Hospedagem/Banco/Wiki/Moodboard/Roadmap/Kanban) a partir do template garlic.docs/notion/, ou popula link real num HQ que já existe"
prompt = "Duas funções pro comando garlic:notion com args `{{args}}` — decidir qual pelo que foi pedido: (A) montar o HQ do zero numa página Notion vazia, ou (B) popular um HQ que já existe (trocar <url-do-repo>/<placeholder> por valor real). Se ambíguo, perguntar antes de agir.\n\nFonte de verdade de todo conteúdo = garlic.docs/notion/*.md (Notion é espelho, nunca a fonte). Se o repo garlic.docs do produto estiver clonado localmente, ler os .md de lá antes de agir. Antes de tudo, ler notion://docs/enhanced-markdown-spec — sintaxe de <columns>/<page>/<mention-page> muda o resultado.\n\n(A) MONTAR DO ZERO:\n1. Confirmar o destino com o humano — nunca assumir. Usar notion-fetch (id: self) pra identificar o workspace, confirmar qual página VAZIA vira o HQ. Nunca criar dentro de página com conteúdo de outro produto sem confirmação explícita.\n2. Criar as 8 áreas primeiro, o HQ raiz por último — ordem importa: mover página (notion-move-pages) depois de já referenciada numa coluna quebra a referência. Criar: Repos (+ 5 filhas <produto>.frontend/.infra/.automations/.backend/.docs, link <url-do-repo> placeholder), Hospedagem, Banco de dados — filhas DIRETAS do HQ, NÃO criar página \"Infra\" intermediária (é só rótulo de coluna); Wiki + filhas Setup & Ambiente/Runbook; Moodboard (vazio de propósito); Roadmap (vazio de propósito); Kanban Board + 2 databases (Desenvolvimento, Estratégico) com propriedades Duração (rich_text) e Tokens (number), gravadas por garlic:task-end, nunca comentário. Todo conteúdo detalhado em garlic.docs/notion/{infra,wiki,setup-ambiente,runbook-redeploy,moodboard,roadmap,kanban}.md.\n3. Criar a página HQ (🎯 <Produto> — HQ): intro + callout de registro + bloco <columns>, 5 colunas ratio 20, 1 por área (Infra, Wiki, Moodboard, Roadmap, Kanban Board). Cada coluna = heading ### com ícone + --- + <page url=\"...\"> de cada filha direta daquela área.\n4. Registrar o link do HQ em garlic.docs/README.md (mapa do workspace).\n\n(B) POPULAR LINK REAL: quando um repo ganha remote de verdade, um projeto Supabase é criado, ou um deploy sobe — achar a subpágina certa (busca pelo nome) e editar só o valor, nunca reescrever o resto do conteúdo. Não achou a página/HQ? Perguntar a URL antes de inventar busca.\n\nFerramentas MCP esperadas: notion-fetch, notion-create-pages, notion-create-database, notion-update-page, notion-move-pages (só antes de montar as colunas, nunca depois). Sem MCP do Notion conectado: parar e pedir pro humano conectar."
