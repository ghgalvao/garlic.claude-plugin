description = "Aplica rebrand de marca (5 cores + 2 fontes + nome do produto) num repo <produto>.frontend já clonado pelo /garlic:new"
prompt = "Aplicar o rebrand de marca no produto `{{args}}` (repo <produto>.frontend, já clonado pelo /garlic:new). Usar EXATAMENTE os valores passados (nome, 5 hex de cor, fonte sans, fonte mono) — não escolher outra cor/fonte, não pedir confirmação de gosto.\n\n1. Gerar o globals.css reusando apps/garlic/src/features/ui/guide/branding/generateGlobalsCss.ts (NUNCA reimplementar a matemática de cor/contraste) via script temporário na RAIZ do repo (<produto>.frontend/_rebrand-tmp.mjs). Path sempre resolvido programaticamente via fileURLToPath(import.meta.url) + path.dirname() pra achar a raiz do repo, nunca ../../.. contado na mão. Rodar com npx tsx _rebrand-tmp.mjs, escrever o resultado em packages/banana-ui/src/styles/globals.css, depois apagar o script temporário.\n\n2. Trocar a string \"Garlic\" em todo lugar hardcoded — grep -rn \"Garlic\" apps/garlic/src apps/garlic/index.html primeiro, não confiar numa lista fixa. Cobre no mínimo: features/ui/*/translations/*.json (header.brand/shared.brand e qualquer outra ocorrência), apps/garlic/index.html <title> e o <link> de Google Fonts (tem que casar com a fonte sans/mono escolhida, senão fica dessincronizado do globals.css regenerado — remover link de fonte leftover que não é nem a sans nem a mono escolhida).\n\n3. Trocar dev@garlic.local (app/config/supabase/fixtures.ts e mockClient.ts) pro domínio do produto novo (dev@<produto>.local).\n\n4. Rodar pnpm build — OBRIGATÓRIO antes de reportar sucesso. Não reportar rebrand concluído sem isso passar verde; se falhar, investigar antes de reportar (import quebrado, string trocada num lugar errado).\n\nAo final, reportar exatamente o que foi trocado (cores, fontes, arquivos de string, fixture) e confirmar que pnpm build passou."
