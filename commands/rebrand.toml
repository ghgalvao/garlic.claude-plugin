description = "Aplica identidade de marca (5 cores + 2 fontes) num produto já clonado e renomeado pelo /garlic:new"
prompt = "Aplicar cor e fonte no produto `{{args}}` (repo <produto>-frontend, já clonado E renomeado pelo /garlic:new — pasta apps/<produto>, prefixo --color-<produto>-*, nada de 'garlic' deveria sobrar). Usar EXATAMENTE os valores passados (5 hex de cor, fonte sans, fonte mono) — não escolher outra cor/fonte, não pedir confirmação de gosto. Nome do produto (pasta, prefixo CSS, arquivos .csproj/.sln, strings 'garlic') NÃO é responsabilidade deste comando — isso já rodou no /garlic:new, sempre. Se apps/<produto> não existir (ainda tem apps/garlic), o /garlic:new não rodou o passo de rename — parar e avisar, não fazer o rename aqui.\n\n1. Gerar o globals.css reusando apps/<produto>/src/features/ui/guide/branding/generateGlobalsCss.ts (NUNCA reimplementar a matemática de cor/contraste) via script temporário na RAIZ do repo (<produto>-frontend/_rebrand-tmp.mjs). Path sempre resolvido programaticamente via fileURLToPath(import.meta.url) + path.dirname() pra achar a raiz do repo, nunca ../../.. contado na mão. Rodar com npx tsx _rebrand-tmp.mjs, escrever o resultado em packages/banana-ui/src/styles/globals.css, depois apagar o script temporário.\n\n2. Sincronizar a fonte no apps/<produto>/index.html — o <link> de Google Fonts tem que casar com a fonte sans/mono escolhida, senão fica dessincronizado do globals.css regenerado. Remover link de fonte leftover que não é nem a sans nem a mono escolhida.\n\n3. Rodar pnpm build — OBRIGATÓRIO antes de reportar sucesso. Não reportar rebrand concluído sem isso passar verde; se falhar, investigar antes de reportar (import quebrado no script temporário, path de CSS desatualizado).\n\nAo final, reportar exatamente o que foi trocado (cores, fontes) e confirmar que pnpm build passou."
