description = "Fecha a medição aberta por /garlic:task-start — calcula duração e tokens gastos (dado real do transcript), documenta o resultado"
prompt = "Fechar a medição de uma task aberta por garlic:task-start. Duração e token sempre calculados por script (dado real do transcript da sessão), nunca estimados no texto da resposta.\n\n1. Calcular via Bash:\n\nnode -e '\nconst fs=require(\"fs\"),os=require(\"os\"),path=require(\"path\");\nconst claudeDir=process.env.CLAUDE_CONFIG_DIR||path.join(os.homedir(),\".claude\");\nconst flagPath=path.join(claudeDir,\".garlic-task-active.json\");\nif(!fs.existsSync(flagPath)){console.error(\"Nenhuma task ativa — rode /garlic:task-start primeiro.\");process.exit(1)}\nconst flag=JSON.parse(fs.readFileSync(flagPath,\"utf8\"));\nfunction sumTokens(file){\n  let out=0,cache=0;\n  if(!file||!fs.existsSync(file))return{out,cache};\n  for(const line of fs.readFileSync(file,\"utf8\").split(\"\\n\")){\n    if(!line.trim())continue;let e;try{e=JSON.parse(line)}catch{continue}\n    if(e.type!==\"assistant\"||!e.message||!e.message.usage)continue;\n    out+=e.message.usage.output_tokens||0;\n    cache+=e.message.usage.cache_read_input_tokens||0;\n  }\n  return{out,cache};\n}\nconst now=new Date();\nconst started=new Date(flag.startedAt);\nconst ms=now-started;\nconst h=Math.floor(ms/3600000),m=Math.floor((ms%3600000)/60000),s=Math.floor((ms%60000)/1000);\nconst durationHuman=h>0?h+\"h \"+m+\"min\":(m>0?m+\"min\":s+\"s\");\nconst{out,cache}=sumTokens(flag.sessionFile);\nconst sessionContinuous=fs.existsSync(flag.sessionFile||\"\");\nconst result={task:flag.task,startedAt:flag.startedAt,endedAt:now.toISOString(),durationMs:ms,durationHuman,outputTokensDelta:sessionContinuous?Math.max(0,out-flag.startOutputTokens):null,cacheReadTokensDelta:sessionContinuous?Math.max(0,cache-flag.startCacheReadTokens):null,sessionContinuous};\nconsole.log(JSON.stringify(result,null,2));\nfs.unlinkSync(flagPath);\n'\n\nSe sessionContinuous vier false (sessão reiniciada no meio), reportar duração normalmente mas avisar que a contagem de token não é confiável — nunca inventar um número nesse caso.\n\n2. Reportar na tela: nome da task, início, fim, duração, tokens de output + cache-read gastos (ou o aviso de descontinuidade).\n\n3. Gravar no task-master.md: achar a linha correspondente (match por nome/descrição) no task-master.md relevante (repo atual ou garlic.docs se cross-repo). Anexar ao final da linha, sem reescrever o resto: ' — ⏱ <duração> · 🪙 ~<tokens> tokens'. Não achou a linha? Reportar o resultado e perguntar onde colar — nunca criar entrada nova só pra caber a métrica.\n\n4. Notion (best-effort, opcional): se houver MCP do Notion conectado E existir board correspondente (Kanban Desenvolvimento ou Estratégico de um HQ montado via bootstrap-notion.md), procurar a linha pelo nome da task e gravar em PROPRIEDADE, não comentário — schema em garlic.docs/notion/kanban.md: Duração (rich_text, ex. '42min') e Tokens (number, output+cache-read). Se o board não tiver essas 2 propriedades ainda, criar as colunas primeiro (mesmo tipo/nome do schema) — não inventar nome diferente, não usar comentário como substituto silencioso. Sem Notion conectado ou sem task achada: pular com uma nota, nunca falhar o comando inteiro por isso."
